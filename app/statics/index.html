<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Analysis</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        main {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .main-graph {
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        .small-graphs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .small-graph {
            height: 250px;
            position: relative;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        .small-graph canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat {
            background: #f4f6f8;
            padding: 20px;
            border-radius: 8px;
        }

        .stat-title {
            font-size: 14px;
            color: #666;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
    <h1>Sleep Analysis Page</h1>
</header>

<main>

    <section class="card">
        <h2>Overall Session</h2>

        <div style="height: 400px; position: relative;">
        <canvas id="overallChart"></canvas>
        </div>
        <p id="chartStatus">Loading test session...</p>
    </section>


    <section class="small-graphs">

        <div class="card">
            <h2>Heart Rate</h2>
            <div class="small-graph">
                <canvas id="hrChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>SpO₂</h2>
            <div class="small-graph">
                <canvas id="spo2Chart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>NTC Temperature</h2>
            <div class="small-graph">
                <canvas id="tempChart"></canvas>
            </div>
        </div>

    </section>


    <section class="card">
        <h2>Sleep Quality</h2>

        <div class="small-graph">
            Sleep quality graph
        </div>
    </section>


    <section class="card">
        <h2>Session Statistics</h2>

        <div class="stats">

            <div class="stat">
                <div class="stat-title">Session Duration</div>
                <div class="stat-value">--</div>
            </div>

            <div class="stat">
                <div class="stat-title">Average HR</div>
                <div class="stat-value">--</div>
            </div>

            <div class="stat">
                <div class="stat-title">Average SpO₂</div>
                <div class="stat-value">--</div>
            </div>

            <div class="stat">
                <div class="stat-title">Detected Events</div>
                <div class="stat-value">--</div>
            </div>

        </div>
    </section>

</main>

<script>
async function loadSession() {
    const status = document.getElementById("chartStatus");

    try {
        const response = await fetch("/api/test-data");

        if (!response.ok) {
            throw new Error("Could not load test data");
        }

        const readings = await response.json();

        if (readings.length === 0) {
            status.textContent = "No test data available.";
            return;
        }


        // Keep track of the last valid sensor values


        let lastHR = null;
        let lastSpO2 = null;
        let lastTemp = null;

        // These are the points currently visible on the graph
        const points = [];

        // Create the chart


        const chart = new Chart(
            document.getElementById("overallChart"),
            {
                type: "line",

                data: {
                    datasets: [{
                        label: "Overall Status",
                        data: points,
                        parsing: false,

                        borderWidth: 2.5,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.2
                    }]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                    animation: false,

                    interaction: {
                        intersect: false,
                        mode: "index"
                    },

                    scales: {
                        x: {
                            type: "linear",

                            min: 0,
                            max: 30,

                            title: {
                                display: true,
                                text: "Time (seconds)"
                            }
                        },

                        y: {
                            min: 0,
                            max: 100,

                            title: {
                                display: true,
                                text: "Status (%)"
                            },

                            ticks: {
                                callback: value => value + "%"
                            }
                        }
                    }
                }
            }
        );

        function createSensorChart(canvasId, label, yAxisLabel, color, yMin = undefined, yMax = undefined) {
            return new Chart(document.getElementById(canvasId), {
                type: "line",
                data: {
                    datasets: [{
                        label: label,
                        data: [],
                        parsing: false,
                        borderColor: color,
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: false,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: {
                        intersect: false,
                        mode: "index"
                    },
                    scales: {
                        x: {
                            type: "linear",
                            min: 0,
                            max: 30,
                            title: {
                                display: true,
                                text: "Time (seconds)"
                            }
                        },
                        y: {
                            min: yMin,
                            max: yMax,
                            title: {
                                display: true,
                                text: yAxisLabel
                            }
                        }
                    }
                }
            });
        }

        const hrChart = createSensorChart(
            "hrChart",
            "Heart Rate",
            "Heart Rate (BPM)",
            "#e05252"
        );

        const spo2Chart = createSensorChart(
            "spo2Chart",
            "SpO₂",
            "SpO₂ (%)",
            "#24a184",
            80,
            100
        );

        const tempChart = createSensorChart(
            "tempChart",
            "NTC Temperature",
            "Temperature (°C)",
            "#e5a13d"
        );

        const charts = [chart, hrChart, spo2Chart, tempChart];
        const hrPoints = [];
        const spo2Points = [];
        const tempPoints = [];

        // Process one reading


        function processReading(reading) {

            // Ignore None / 0 / invalid values
            if (
                Number.isFinite(reading.hr) &&
                reading.hr > 0
            ) {
                lastHR = reading.hr;
            }

            if (
                Number.isFinite(reading.spo2) &&
                reading.spo2 > 0 &&
                reading.spo2 <= 100
            ) {
                lastSpO2 = reading.spo2;
            }

            if (
                Number.isFinite(reading.temp) &&
                reading.temp > 0
            ) {
                lastTemp = reading.temp;
            }

            if (lastHR !== null) {
                hrPoints.push({
                    x: reading.timestamp,
                    y: lastHR
                });
            }

            if (lastSpO2 !== null) {
                spo2Points.push({
                    x: reading.timestamp,
                    y: lastSpO2
                });
            }

            if (lastTemp !== null) {
                tempPoints.push({
                    x: reading.timestamp,
                    y: lastTemp
                });
            }

            // We need all three signals before creating
            // the overall status value.
            if (
                lastHR === null ||
                lastSpO2 === null ||
                lastTemp === null
            ) {
                return;
            }

            // Temporary demo scoring
            // will definitely be replaced with a real scoring algorithm later

            const spo2Score = Math.max(
                0,
                Math.min(100, (lastSpO2 - 80) * 5)
            );

            const hrScore = Math.max(
                0,
                100 - Math.abs(lastHR - 72) * 2
            );

            // Look at the previous 10 seconds of temperature
            const recent = readings.filter(
                r =>
                    r.timestamp <= reading.timestamp &&
                    r.timestamp >= reading.timestamp - 9 &&
                    Number.isFinite(r.temp) &&
                    r.temp > 0
            );

            const tempRange = recent.length
                ? Math.max(...recent.map(r => r.temp)) -
                  Math.min(...recent.map(r => r.temp))
                : 0;

            const tempScore = Math.min(
                100,
                tempRange * 50
            );

            const score =
                0.5 * spo2Score +
                0.25 * hrScore +
                0.25 * tempScore;

            points.push({
                x: reading.timestamp,
                y: Math.round(score * 10) / 10
            });
        }


        // Update the X axis


        function updateXAxis(timestamp) {
            const interval = 30;

            const newMax = Math.max(
                interval,
                Math.ceil((timestamp + 1) / interval) * interval
            );

            for (const currentChart of charts) {
                currentChart.options.scales.x.max = newMax;
                currentChart.update("none");
            }
        }


        // Play the test session


        let index = 0;

        function showNextReading() {

            if (index >= readings.length) {
                status.textContent =
                    `Session complete — ${readings.length} samples processed.`;

                return;
            }

            const reading = readings[index];

            processReading(reading);

            chart.data.datasets[0].data = points;
            hrChart.data.datasets[0].data = hrPoints;
            spo2Chart.data.datasets[0].data = spo2Points;
            tempChart.data.datasets[0].data = tempPoints;

            updateXAxis(reading.timestamp);

            status.textContent =
                `Live session: ${reading.timestamp} seconds`;

            index++;

            // One simulated sensor reading per second
            setTimeout(showNextReading, 1000);
        }

        // Start the simulated session
        showNextReading();

    } catch (error) {
        console.error(error);

        status.textContent =
            "Could not load the graph. Check the server terminal.";
    }
}

loadSession();
</script>
</body>
</html>
